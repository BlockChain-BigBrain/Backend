name: Contributor invitation validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/contributor-invitations-p0-p1]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          npx prisma generate
          npm run build
