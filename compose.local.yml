name: track-ai-local
services:
  mysql:
    image: mysql:8.4
    container_name: track-ai-mysql
    environment:
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: track_ai
      MYSQL_USER: track_ai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run local:setup first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run local:setup first}
    ports:
      - '127.0.0.1:33306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -u root --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  ipfs:
    image: ipfs/kubo:v0.43.1
    container_name: track-ai-ipfs
    ports:
      - '127.0.0.1:5001:5001'
      - '127.0.0.1:8080:8080'
    volumes:
      - ipfs-data:/data/ipfs
volumes:
  mysql-data:
  ipfs-data:
